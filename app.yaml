runtime: nodejs24

instance_class: F1

# Global error handler for 404 pages (serves dist/404.html)
error_handlers:
  - file: dist/404.html

handlers:
  # 1. Long-term caching for static fonts (/static/fonts/**)
  - url: /static/fonts/(.*\.(woff|woff2))$
    static_files: dist/static/fonts/\1
    upload: dist/static/fonts/.*\.(woff|woff2)$
    secure: always
    expiration: 365d
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
      Strict-Transport-Security: max-age=31556926; includeSubDomains

  # 2. Direct static assets pass-through (JS, CSS, images, json, xml, txt, etc.)
  - url: /(.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|json|xml|txt))$
    static_files: dist/\1
    upload: dist/(.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|json|xml|txt))$
    secure: always
    http_headers:
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
      Strict-Transport-Security: max-age=31556926; includeSubDomains

  # 3. Root homepage
  - url: /
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
    http_headers:
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
      Strict-Transport-Security: max-age=31556926; includeSubDomains
      Content-Security-Policy: >-
        default-src 'self' https:;
        script-src 'self' https: 'unsafe-inline';
        style-src 'self' https: 'unsafe-inline';
        img-src 'self' https: data:;
        font-src 'self' https: data:;
        connect-src 'self' https:;

  # 4. Clean URLs routing (e.g. /about -> dist/about/index.html)
  - url: /(.*)
    static_files: dist/\1/index.html
    upload: dist/(.*)/index.html
    secure: always
    http_headers:
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
      Strict-Transport-Security: max-age=31556926; includeSubDomains
      Content-Security-Policy: >-
        default-src 'self' https:;
        script-src 'self' https: 'unsafe-inline';
        style-src 'self' https: 'unsafe-inline';
        img-src 'self' https: data:;
        font-src 'self' https: data:;
        connect-src 'self' https:;
